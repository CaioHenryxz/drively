[versions]
agp              = "8.7.3"
kotlin           = "2.1.0"
coreKtx          = "1.15.0"
lifecycle        = "2.8.7"
activityCompose  = "1.9.3"
composeBom       = "2024.12.01"
navigation       = "2.8.5"
# Supabase — cliente Kotlin oficial
supabase         = "3.1.4"
ktor             = "3.1.1"
coroutines       = "1.9.0"
serialization    = "1.7.3"

[libraries]
androidx-core-ktx            = { group = "androidx.core",              name = "core-ktx",                    version.ref = "coreKtx" }
androidx-lifecycle-runtime   = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",       version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose    = { group = "androidx.activity",          name = "activity-compose",            version.ref = "activityCompose" }
compose-bom                  = { group = "androidx.compose",           name = "compose-bom",                 version.ref = "composeBom" }
compose-ui                   = { group = "androidx.compose.ui",        name = "ui" }
compose-ui-graphics          = { group = "androidx.compose.ui",        name = "ui-graphics" }
compose-ui-tooling-preview   = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
compose-ui-tooling           = { group = "androidx.compose.ui",        name = "ui-tooling" }
compose-material3            = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons       = { group = "androidx.compose.material",  name = "material-icons-extended" }
navigation-compose           = { group = "androidx.navigation",        name = "navigation-compose",          version.ref = "navigation" }
coroutines-android           = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-android",  version.ref = "coroutines" }
serialization-json = { group = "org.jetbrains.kotlinx",      name = "kotlinx-serialization-json",  version.ref = "serialization" }

# Supabase
supabase-bom       = { group = "io.github.jan-tennant.supabase", name = "bom",           version.ref = "supabase" }
supabase-postgrest  = { group = "io.github.jan-tennant.supabase", name = "postgrest-kt",  version.ref = "supabase" }
supabase-auth       = { group = "io.github.jan-tennant.supabase", name = "auth-kt",       version.ref = "supabase" }
ktor-android        = { group = "io.ktor",                        name = "ktor-client-android", version.ref = "ktor" }
ktor-cio                     = { group = "io.ktor",                    name = "ktor-client-cio",             version.ref = "ktor" }

[plugins]
android-application  = { id = "com.android.application",             version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
